<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="날아라 아유 보드">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="날아라 아유 보드">
<title>날아라 아유 보드</title>
<link rel="manifest" href="./manifest.webmanifest?v=r7">
<link rel="icon" href="./favicon-48-r7.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-r7.png">
<link rel="apple-touch-icon" href="./apple-touch-icon-r7.png">
<link rel="apple-touch-icon-precomposed" href="./apple-touch-icon-r7.png">
<style>
/* 주아 (Jua) · 카카오 작은글씨 — SIL Open Font License 1.1. FONT-LICENSE.txt 참고.
   앱 안의 파일을 먼저 쓰고, 없으면 CDN 으로 넘어간다. */
@font-face{
  font-family:"Jua";
  src:url("./Jua-Korean.woff2") format("woff2"),
      url("https://cdn.jsdelivr.net/npm/@fontsource/jua@5/files/jua-korean-400-normal.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap;
}
@font-face{
  font-family:"Kakao Small Sans";
  src:url("./KakaoSmallSans-Regular.woff2") format("woff2");
  font-weight:400;font-style:normal;font-display:swap;
}
@font-face{
  font-family:"Kakao Small Sans";
  src:url("./KakaoSmallSans-Bold.woff2") format("woff2");
  font-weight:600 700;font-style:normal;font-display:swap;
}

/* ═══════════════════════════════════════════════════════════════
   날아라 아유 보드 — 도아 킥·도아 셈과 같은 뼈대, 민트 하늘 테마.
   배경은 민트, 카드는 흰 판. 민트 진한색은 "해냈다"는 신호에만,
   하늘색은 달력·영역 제목에, 과목은 저마다의 색 꼬리표로.
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* 바탕은 흰색 한 가지(도아 킥·도아 셈과 같게), 민트는 영역이 입는다 */
  --bg0:#ffffff; --bg1:#d4faeb; --bg2:#effdf8;
  --mint:#7ff3cf; --mint-2:#5eeabd; --mint-wash:#e8fdf5;
  --line:#8fe9ca; --line-soft:#c9f8e6;
  --surface:#ffffff; --field:#ffffff;

  --ink:#07352c; --ink-2:#1d5a4d; --ink-3:#3f8577;

  /* 민트 — 해냈다는 신호 */
  --pulse:#00c794; --pulse-strong:#009b74;
  --pulse-dim:#4ff0c0; --pulse-wash:#c9fdea; --pulse-ink:#ffffff;

  /* 하늘 — 달력·영역 제목 */
  --sky:#1a96ff; --sky-strong:#0a74e6; --sky-wash:#ddefff;

  /* 빨간 색연필 — 채점 동그라미 */
  --red:#ff2a2a; --red-ink:#e8201c;
  --amber:#c26f00; --amber-wash:#fff2c8;
  --coral:#f23d3d; --coral-wash:#ffe6e3;

  /* 과목 색 */
  --s-math:#3b5bff; --s-math-w:#e3e9ff;
  --s-eng:#ff3b7f;  --s-eng-w:#ffe3ee;
  --s-sci:#9a4dff;  --s-sci-w:#f1e5ff;
  --s-read:#ff9500; --s-read-w:#fff0d4;
  --s-etc:#14a894;  --s-etc-w:#d6f7f1;

  --shadow-1:0 1px 2px rgba(0,120,90,.10);
  --shadow-2:0 8px 28px rgba(10,60,48,.16);
  --st-shadow:drop-shadow(0 1.5px 1.5px rgba(0,0,0,.2));

  /* 글자 크기 5단 — 12 보조 · 14 설명 · 15 본문(학습 이름) · 17 영역 제목 · 22 앱 제목 */
  --fs-xs:12px; --fs-sm:14px; --fs-md:15px; --fs-xl:17px; --fs-2xl:22px;
  --fs-score:clamp(17px,4.8vw,20px);

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);

  --tap:44px; --pill:34px;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --ease:cubic-bezier(.22,1,.36,1);
  --f-round:"Jua","Kakao Small Sans",-apple-system,BlinkMacSystemFont,
            "Apple SD Gothic Neo","Segoe UI",Roboto,"Malgun Gothic",sans-serif;
}

*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg0)}
body{
  font-family:var(--f-round);font-size:var(--fs-md);line-height:1.6;color:var(--ink);
  background:var(--bg0);min-height:100vh;min-height:100dvh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;font-synthesis:none;-webkit-tap-highlight-color:transparent;
}
button,input,textarea{font:inherit}
button{color:inherit;background:none;border:0;padding:0;cursor:pointer;
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
svg{pointer-events:none}
::selection{background:var(--pulse-dim);color:var(--ink)}
:focus-visible{outline:2px solid var(--pulse-dim);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

.wrap{
  max-width:520px;margin:0 auto;
  padding:calc(14px + var(--safe-t)) calc(16px + var(--safe-r))
          calc(56px + var(--safe-b)) calc(16px + var(--safe-l));
  display:flex;flex-direction:column;gap:13px;
}
.wrap>section:empty{display:none}
@media (display-mode:standalone){.wrap{padding-top:calc(16px + var(--safe-t))}}

.card{background:var(--surface);border:2px solid var(--mint);border-radius:var(--r-md);box-shadow:var(--shadow-1);padding:11px 13px 12px}
.eyebrow{font-size:var(--fs-xs);letter-spacing:.06em;color:var(--sky)}

/* 누름 반응 */
.todo .box,.bl .go,.btn,.chip,.nav button,.addbtn{transition:transform .12s var(--ease)}
.todo .box:active,.bl .go:active,.btn:active,.chip:active,.addbtn:active,.nav button:active:not([disabled]){transform:scale(.96)}
.day:active{background:var(--line-soft)}

/* ── 스티커 ── */
.st{display:block;filter:var(--st-shadow)}
@keyframes stickon{0%{transform:scale(0) rotate(-28deg);opacity:0}58%{transform:scale(1.3) rotate(9deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.st.pop{animation:stickon .44s var(--ease) both}

/* ── 헤더 ── */
header{display:flex;align-items:center;gap:8px}
header .title{font-size:var(--fs-2xl);line-height:1.25;font-weight:400;color:var(--ink);flex:1;min-width:0}
header .title em{font-style:normal;color:var(--pulse)}
header .sub{display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-top:1px}
.plane{
  flex:none;width:44px;height:44px;border-radius:14px;background:#2ca0df;border:2.5px solid #00584a;padding:0;
  overflow:hidden;box-shadow:var(--shadow-1);display:block;
}
.plane img{display:block;width:100%;height:100%;object-fit:cover;transform-origin:50% 60%}
.plane svg{width:32px;height:32px;display:block;transform-origin:50% 50%}
/* 이륙 — 학습을 하나 끝낼 때마다 오른쪽 위로 날아갔다가 다시 들어온다 */
.plane{overflow:hidden}
.plane.go img{animation:hop .6s var(--ease) both}
/* 칸 안에서 커졌다가 돌아오기만 한다 — 그림이 칸보다 작아지거나 밀려나지 않아 가장자리가 비치지 않는다 */
@keyframes hop{0%{transform:scale(1)}35%{transform:scale(1.14)}65%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes takeoff{
  0%{transform:translate(0,0)}
  38%{transform:translate(34px,-34px)}
  39%{transform:translate(-34px,34px)}
  100%{transform:translate(0,0)}
}

/* ── 비행 고도 카드 ── */
.flight{
  position:relative;overflow:hidden;border-radius:var(--r-md);box-shadow:var(--shadow-1);
  color:#fff;padding:7px 8px 7px;
  background:linear-gradient(180deg,var(--sky-top,#7cc9ee) 0%,var(--sky-bot,#bfeadb) 100%);
}
.flight{color:var(--ink)}
/* 글자는 하늘 위에 바로 올리지 않고 반투명 흰 판 위에 — 하늘색이 바뀌어도 늘 또렷하게 */
.flight .fl-top{display:flex;align-items:stretch;gap:6px;position:relative;z-index:2}
.flight .fl-card{flex:none;background:rgba(255,255,255,.9);border-radius:10px;padding:3px 9px 4px;min-width:0;box-shadow:0 1px 3px rgba(0,60,50,.12)}
.flight .fl-k{font-size:var(--fs-xs);line-height:1.3;color:var(--sky-strong)}
.flight .fl-lv{font-size:var(--fs-md);line-height:1.2;white-space:nowrap;color:var(--ink)}
.flight .fl-say{font-size:var(--fs-xs);color:var(--ink-2)}
.flight .fl-alt{text-align:right;flex:none;display:flex;flex-direction:column;justify-content:center}
.flight .fl-alt b{display:block;font-weight:400;font-size:var(--fs-xl);line-height:1.15;font-variant-numeric:tabular-nums;color:var(--pulse-strong)}
.flight .fl-alt span{font-size:var(--fs-xs);white-space:nowrap;color:var(--ink-2)}
.flight.dark .fl-card{background:rgba(255,255,255,.94)}
.flight .runway{position:relative;flex:1;min-width:60px;z-index:1}
.flight .path{position:absolute;inset:0;width:100%;height:100%}
.flight .jet{
  position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;
  transition:left .8s var(--ease),top .8s var(--ease);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.22));
}
.flight .jet svg{width:100%;height:100%;display:block;animation:hover 2.6s ease-in-out infinite;transform-origin:50% 60%}
@keyframes hover{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
.flight .goal{position:absolute;right:0;top:-2px;width:20px;height:20px}
.flight .fl-next{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:var(--fs-xs);margin-top:5px;position:relative;z-index:2}
.flight .fl-next>span{background:rgba(255,255,255,.9);color:var(--ink);padding:1px 9px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,60,50,.12)}
.flight .fl-next .pill{background:var(--pulse);color:#fff}
.flight .deco{position:absolute;pointer-events:none;z-index:0}
.flight .runway .deco{z-index:0}
.flight .runway .jet,.flight .runway .goal{z-index:2}
.flight.lvup{animation:lvup 1s var(--ease)}
@keyframes lvup{0%{transform:scale(1)}30%{transform:scale(1.03)}100%{transform:scale(1)}}

/* ── 스코어보드 ── */
.board{
  /* 연한 민트 바탕 — 글자는 진한 색으로 */
  display:grid;grid-template-columns:repeat(3,1fr);
  background:#c6f6e3;border-radius:var(--r-md);box-shadow:var(--shadow-1);overflow:hidden;color:var(--ink);
}
.board .cell{padding:6px 9px 7px;border-left:1.5px solid rgba(255,255,255,.75);min-width:0}
.board .cell:first-child{border-left:0}
.board .v{display:block;font-size:var(--fs-score);line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.board .v u{text-decoration:none;font-size:var(--fs-sm);color:var(--ink-2);margin-left:1px}
.board .k{display:block;font-size:var(--fs-xs);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .v.beat{animation:beat .5s var(--ease)}
@keyframes beat{0%{transform:scale(1)}34%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ── 과목별 성장 ── */
.growth{background:var(--surface);border-color:var(--pulse)}   /* 밀린 학습과 같은 짜임: 흰 카드 + 진한 민트 테두리 */
.g-toggle{display:flex;align-items:center;gap:8px;width:100%;min-height:26px;text-align:left}
.g-toggle .g-sum{flex:1;text-align:right;font-size:var(--fs-xs);color:var(--ink-2)}
.g-toggle .chev{width:18px;height:18px;color:var(--ink-2)}
.g-toggle .chev svg{width:18px;height:18px}
.g-toggle.open .chev{transform:rotate(180deg)}
.g-body{display:flex;flex-direction:column;gap:7px;margin-top:7px}
.g-body .seg{align-self:flex-start;background:#fff;border-color:#fff}
.g-title{font-size:13px;color:var(--ink)}
.g-list{padding:4px 10px}
.seg{display:flex;background:var(--bg2);border:1.5px solid var(--line);border-radius:999px;padding:2px}
.seg button{font-size:var(--fs-xs);padding:3px 10px;border-radius:999px;color:var(--ink-3);min-height:28px}
.seg button.on{background:var(--pulse);color:#fff}
.g-row{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:9px;padding:5px 0}
.g-list .g-row+.g-row{border-top:1px solid var(--line-soft)}
.g-bar{height:12px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.g-bar i{display:block;height:100%;border-radius:999px;transition:width .6s var(--ease)}
.g-num{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-2);text-align:right;min-width:74px}
.g-num small{font-size:var(--fs-xs);color:var(--ink-3)}
.g-foot{font-size:var(--fs-xs);color:var(--ink-2)}

/* 과목 꼬리표 */
.subj{display:inline-flex;align-items:center;justify-content:center;flex:none;
  font-size:var(--fs-xs);line-height:1;padding:4px 7px;border-radius:7px;white-space:nowrap}
/* 과목 색은 과목마다 정해져 있어 인라인으로 입힌다 */

/* ── 달력 ── */
.cal{border-color:var(--pulse)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.cal-title{font-size:var(--fs-md);font-variant-numeric:tabular-nums;color:var(--sky-strong)}
.nav{display:flex;gap:6px;align-items:center}
.nav button{position:relative;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:var(--surface);border:1.5px solid var(--line);color:var(--ink-2)}
.nav button::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;min-width:var(--tap);height:var(--tap)}
.nav .jump{width:auto;padding:0 10px;font-size:var(--fs-xs);color:var(--sky-strong)}
.nav button[disabled]{opacity:.32;cursor:default}
.nav svg{width:15px;height:15px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:var(--fs-xs);color:var(--ink-3);padding-bottom:5px}
.dow span:first-child{color:var(--coral)}
.dow span:last-child{color:var(--sky)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.day{background:var(--surface);aspect-ratio:1/1;min-height:44px;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 1px;overflow:hidden;outline:none!important}
.day.pad,.day.out{background:var(--bg2)}
.day.out{opacity:.5}
.day .n{font-size:var(--fs-sm);line-height:1;font-variant-numeric:tabular-nums;
  flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:7px}   /* 모든 날 같은 상자 — 고른 날도 점 높이가 그대로 */
.day.sun .n{color:var(--coral)}
.day.sat .n{color:var(--sky)}
.day.missed .n{color:var(--ink-3)}
.day.full{background:var(--pulse-wash)}
.dots{display:flex;gap:2px;margin-top:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;opacity:.35}
.dots i.on{opacity:1}
/* 다 해낸 날 스티커 — 숫자 상자 22 + 사이 2 + 스티커 13 = 37px, 가장 작은 칸(44px)에도 여유 있게 들어간다 */
.day .dst{width:13px;height:13px;flex:none;margin-top:1px}
.day .dst .st{width:13px;height:13px}
.day .memo{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
.day.today .n,.day.sel .n,.day.full .n{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:7px}
.day.today .n{background:var(--pulse);color:#fff}
.day .n{position:relative}
.day.sel .n{box-shadow:inset 0 0 0 2.5px var(--sky)}
/* 다 해낸 날 — 날짜 숫자 네모 테두리만 빨간펜으로 (선이 겹치지 않게 한 줄만).
   고른 날이면서 다 해낸 날은 테두리는 빨강, 고른 표시는 칸 바탕(하늘색)으로 */
.day.full .n,.day.full.sel .n{box-shadow:inset 0 0 0 2px var(--red)}
.day.full.sel{background:var(--sky-wash)}
.cal-leg{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:var(--fs-xs);color:var(--ink-3)}
.cal-leg span{display:inline-flex;align-items:center;gap:4px}
.cal-leg i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ── 하루 패널 ── */
.daypanel{border-color:var(--pulse)}
@keyframes panelflash{0%{box-shadow:0 0 0 0 var(--pulse-dim)}28%{box-shadow:0 0 0 5px var(--pulse-dim)}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.daypanel.flash{animation:panelflash .95s var(--ease)}
.today-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.today-date{font-size:var(--fs-md);line-height:1.3}
.when{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:var(--fs-xs);background:var(--bg1);color:var(--ink-3)}
.badge{display:flex;align-items:center;gap:5px;flex:none;background:var(--pulse);color:#fff;
  padding:4px 11px 4px 8px;border-radius:999px;transform:rotate(-5deg);box-shadow:var(--shadow-1);font-size:var(--fs-md);line-height:1}
.badge .st{width:22px;height:22px;filter:none}
.badge.pop{animation:stickon .5s var(--ease) both}
.dprog{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:4px}
.dprog .bar{flex:1;height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.dprog .bar i{display:block;height:100%;background:var(--pulse);border-radius:999px;transition:width .5s var(--ease)}

.todos{border-top:1px solid var(--line);padding-top:7px}
.todo{display:flex;align-items:center;gap:6px;padding:3px 0}
.todo .box{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;position:relative;padding:0}
.todo .box::after{content:"";position:absolute;top:50%;left:50%;width:var(--tap);height:var(--tap);transform:translate(-50%,-50%)}
.todo .box .ic{width:17px;height:17px;display:block}
/* 빨간 색연필 동그라미 — 선생님이 채점하듯 해낸 학습에 그려진다 */
.redo{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;overflow:visible}
.redo path{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.redo.pop path{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .5s cubic-bezier(.5,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.todo.on .box .ic{opacity:.5}
.todo .txt{flex:1;min-width:0;display:flex;align-items:center;gap:6px;text-align:left;padding:2px 0;line-height:1.35;font-size:13px}
/* 내용 열 맞추기 — 메인: 도구 34 + 9 + 과목 58 + 7 = 108px, 서브: 43 + ㄴ·체크 58 + 7 = 108px */
/* 내용 열 맞추기 — 메인: 도구 26 + 6 + 과목 20 + 6 = 58px, 서브: 29 + ㄴ 7 + 3 + 체크 16 + 3 = 58px */
.subj.mini{width:20px;height:20px;padding:0;border-radius:6px;font-size:var(--fs-xs);line-height:1}
.todo .txt .tt{min-width:0;word-break:break-word}
.todo.on .txt .tt{color:#b3c2be}   /* 해낸 학습은 한층 연하게 */
/* 아직 안 한 학습 — 형광펜으로 그은 듯한 노란 밑줄. 해내면 밑줄이 빠지고 글자는 회색이 된다 */
.todo:not(.on):not(.ghost) .txt .tt,.kid:not(.on):not(.note) .kt .hl{   /* 칸 전체가 아니라 글자에만 */
  color:var(--ink);
  background:linear-gradient(transparent 55%,#ffe81a 55%,#ffe81a 94%,transparent 94%);   /* 선명한 형광 노랑 */
  -webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px}
.todo .tst{flex:none;width:26px;height:26px}
.todo .tst .st{width:26px;height:26px}
.t-count{flex:none;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;padding:2px 0;white-space:nowrap}
.t-count u{text-decoration:none;font-size:11px}
.todo.on .t-count{color:#b3c2be}
.carry{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:999px;font-size:10px;white-space:nowrap;color:var(--amber);background:var(--amber-wash)}
.carry.long{color:var(--coral);background:var(--coral-wash)}
.carry.mv{color:var(--sky-strong);background:var(--sky-wash)}
button.carry.mv{font:inherit;font-size:var(--fs-xs);border:0;cursor:pointer}
.kid.ghost.gdone .kbox{border-color:var(--red);background:#fff}
/* 옮긴 자국 — 글자만 연한 회색, 체크 칸은 해야 할 일처럼 그대로. 체크는 옮긴 날에서만 */
.todo.ghost .tt,.todo.ghost .t-count{color:#b3c2be}
.todo.ghost .carry.mv{color:#6f7f7b;background:#eef2f1;text-decoration:none}
.carry.skip{color:var(--ink-3);background:var(--bg1)}
.del{flex:none;color:var(--ink-3);width:28px;height:28px;margin:-4px -6px -4px -4px;border-radius:9px;display:grid;place-items:center}
.del svg{width:13px;height:13px}
.empty{font-size:var(--fs-sm);color:var(--ink-3);padding:2px 0}

.addbtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:42px;margin-top:7px;
  border-radius:var(--r-sm);border:1.5px dashed var(--pulse-dim);color:var(--pulse-strong);font-size:var(--fs-md);background:var(--bg2)}
.addbtn svg{width:17px;height:17px}

/* 오늘의 성장 한 줄 */
.diary{margin-top:10px;padding:9px 10px 10px;border-radius:var(--r-sm);background:var(--pulse-wash)}   /* 과목별 성장·밀린 학습과 같은 연한 민트 */
.diary .lb{display:flex;align-items:center;gap:5px;font-size:13px;line-height:1.6;color:var(--ink);margin:0 0 3px}
.diary .lb svg{width:14px;height:14px;color:var(--ink-2)}
.diary textarea{
  width:100%;min-height:62px;resize:none;border:1.5px solid #ffffff;border-radius:var(--r-sm);
  padding:8px 10px;font-size:13px;line-height:1.45;color:var(--ink);background:#ffffff;   /* 학습 목록 글자와 같게 */
  -webkit-appearance:none;appearance:none;font-family:inherit;
}
.diary textarea:focus{outline:0;border-color:var(--pulse)}
/* 안내 문구는 조금 더 작게 */
.diary textarea::placeholder{font-size:var(--fs-xs);color:var(--ink-3)}
.diary .saved{font-size:var(--fs-xs);color:var(--ink-2);margin-top:3px;min-height:1em}

.cheer{display:flex;align-items:center;gap:8px;margin-top:9px;padding:8px 10px;background:var(--pulse-wash);
  border-radius:var(--r-sm);font-size:var(--fs-md);color:var(--pulse-strong)}
.cheer .st{width:26px;height:26px;flex:none}
.note{font-size:var(--fs-sm);color:var(--ink-2);background:var(--bg2);border-radius:var(--r-sm);padding:8px 10px;margin-top:9px;line-height:1.5}

/* ── 학습 만들기 ── */
.lmode{margin:2px 0 8px;width:100%}
.lmode button{flex:1;min-height:32px;font-size:var(--fs-sm)}
.lrange{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lrange input{flex:1;min-width:0;font-family:inherit;font-size:16px;min-height:var(--tap);padding:6px 10px;color:var(--ink);
  background:var(--field);border:2px solid var(--line);border-radius:var(--r-sm);-webkit-appearance:none;appearance:none}
.lrange span{color:var(--ink-3)}
.lday{padding:4px 0 6px}
.lday+.lday{border-top:1px dashed var(--line)}
.lday-h{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:32px;font-size:var(--fs-sm);color:var(--sky-strong)}
.lday-h em{font-style:normal;font-size:var(--fs-xs);color:#fff;background:var(--pulse);padding:1px 7px;border-radius:999px;margin-left:4px}
.lday-n{font-size:var(--fs-xs);color:var(--ink-3)}
.addkid{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--pulse-strong);
  background:var(--mint-wash);border:1.5px solid var(--mint);margin-right:2px}
.addkid svg{width:12px;height:12px}
.by{flex:none;display:inline-flex;align-items:center;font-size:10px;line-height:1;padding:2px 5px;border-radius:999px;color:#fff;margin-left:4px;vertical-align:1px}
.kid{display:flex;align-items:center;gap:3px;padding:2px 0 2px 29px;font-size:13px;line-height:1.35}
.kid-l{flex:none;color:var(--ink-3);width:7px;font-size:10px;text-align:right}
.kid .kt{flex:1;min-width:0;word-break:break-word;text-align:left;padding:2px 0}
.kid.ghost .kt{color:#b3c2be}
.kid.ghost .carry.mv{color:#6f7f7b;background:#eef2f1}
.kidform .dates{display:flex;align-items:center;gap:7px}
.kidform .dates input{flex:1;min-width:0}
.kid.on .kt{color:#b3c2be}
.kbox{flex:none;position:relative;width:16px;height:16px;border-radius:4px;border:2px solid var(--line);margin-right:0;background:#fff;padding:0;display:grid;place-items:center}
.kbox::after{content:"";position:absolute;top:50%;left:50%;width:var(--tap);height:var(--tap);transform:translate(-50%,-50%)}
.kid.on .kbox{border-color:var(--red)}
/* 서브 학습 체크 — 네모 칸 안에 빨간펜 V */
.vchk{width:13px;height:13px;overflow:visible}
.vchk path{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.vchk.pop path{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .35s cubic-bezier(.5,0,.3,1) forwards}
.kbox .redo{width:26px;height:26px;margin:-13px 0 0 -13px}
.kid.note .kt{color:var(--ink-2)}
.kic{flex:none;width:16px;height:16px;display:grid;place-items:center;color:var(--sky-strong)}
.kic svg{width:14px;height:14px}
.kid .del{width:26px;height:26px}
.kidform{margin:4px 0 8px 29px;padding:9px 10px;border-radius:var(--r-sm);background:var(--bg2);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:7px}
.kidform input{width:100%;font-family:inherit;font-size:16px;min-height:var(--tap);padding:8px 12px;color:var(--ink);background:#fff;
  border:2px solid var(--line);border-radius:var(--r-sm);-webkit-appearance:none;appearance:none}
.kidform input:focus{outline:0;border-color:var(--pulse)}
.kf-foot{display:flex;align-items:center;gap:7px}
.kf-me{flex:1;min-width:0;font-size:var(--fs-xs);color:var(--ink-3)}
.kf-foot .btn{flex:none}
.chips.roles .chip{min-width:64px}
.chips.roles .chip.on{color:#fff}
.composer{margin-top:8px;padding:11px 11px 12px;border-radius:var(--r-md);background:var(--bg2);
  border:1.5px solid var(--line);display:flex;flex-direction:column;gap:9px}
.composer.edit{margin:4px 0 6px}
.fld{display:block;min-width:0}
.fld .lb{display:block;font-size:var(--fs-xs);color:var(--ink-3);margin-bottom:4px}
.composer input{width:100%;font-family:inherit;font-size:16px;min-height:var(--tap);padding:8px 12px;color:var(--ink);
  background:var(--field);border:2px solid var(--line);border-radius:var(--r-sm);-webkit-appearance:none;appearance:none}
.composer input::placeholder{color:#9db2ac}
.composer input:focus{border-color:var(--pulse-dim);outline:0}
.composer input[type=number]{height:var(--pill);min-height:0;padding:0 10px;line-height:1}
.composer input[type=date]{line-height:1.2}
.row2{display:flex;gap:9px}
.row2 .fld.num{flex:0 0 96px}
.row2 .fld.unit{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.sub{margin-top:5px}
.chips.sub .chip{padding:0 10px;font-size:var(--fs-xs)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:var(--pill);padding:0 12px;border-radius:999px;
  font-size:var(--fs-sm);border:1.5px solid var(--line);color:var(--ink-2);background:var(--surface)}
.chip.on{background:var(--pulse);border-color:var(--pulse);color:#fff}
.chip[disabled]{opacity:.35}
.chips.subjs .chip{gap:5px}
.chips.subjs .chip i{width:8px;height:8px;border-radius:50%}
.chips.subjs .chip.on i{background:#fff!important}
.chips.subjs .chip.on{color:#fff}
.chip.addsub{border-style:dashed;color:var(--pulse-strong);border-color:var(--pulse)}
.newsub{display:flex;gap:7px;margin-top:7px}
.newsub input{flex:1;min-width:0}
.newsub .btn{flex:none;min-height:var(--tap)}
/* 과목 관리 */
.sm-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-top:1px solid var(--line-soft)}
.sm-row:first-of-type{border-top:0}
.sm-ic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1.5px solid var(--line)}
.sm-ic .ic{width:22px;height:22px}
.sm-col{flex:none;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sm-row input{flex:1;min-width:0;font-family:inherit;font-size:16px;height:36px;padding:0 10px;color:var(--ink);
  background:var(--field);border:2px solid var(--line);border-radius:var(--r-sm);-webkit-appearance:none;appearance:none}
.sm-del{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}
.sm-del svg{width:15px;height:15px}
.sm-hint{font-size:var(--fs-xs);color:var(--ink-3);margin-top:6px}
.chips.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.chips.dows .chip{padding:0}
.chips.dows .chip.sun{color:var(--coral)}
.chips.dows .chip.on{color:#fff}
.chips.sugg .chip{min-height:30px;font-size:var(--fs-xs);padding:0 10px;border-style:dashed;color:var(--ink-3)}
.dates{display:flex;align-items:center;gap:8px}
.dates input{flex:1;min-width:0}
.dates .tilde{flex:none;color:var(--ink-3)}
.ordhint{align-self:center;font-size:var(--fs-xs);color:var(--ink-3);margin-left:2px}
.cerr{font-size:var(--fs-xs);color:var(--coral)}
.chint{font-size:var(--fs-xs);color:var(--ink-3)}
.cacts{display:flex;gap:8px}
.cacts .btn{flex:1}

.btn{flex:1 1 140px;min-height:var(--tap);padding:0 14px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-size:var(--fs-sm);border:1.5px solid var(--line);background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow-1)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--pulse);border-color:var(--pulse);color:#fff}
.btn.warn{color:var(--coral);border-color:var(--coral)}
.btn.dismiss{flex:0 0 auto;min-width:var(--tap);color:var(--ink-3);border-color:transparent;background:none;box-shadow:none}

/* ── 밀린 학습 ── */
.backlog{background:var(--surface);border:2px solid var(--pulse);border-radius:var(--r-md);box-shadow:var(--shadow-1);padding:11px 13px 12px}
.bl-in{padding:9px 10px 10px;border-radius:var(--r-sm);background:var(--pulse-wash)}
.backlog h2{font-size:13px;font-weight:400;color:#c21d17;margin:0 0 3px}
.backlog h2 .hl{background:linear-gradient(transparent 55%,#ffe81a 55%,#ffe81a 94%,transparent 94%);padding:0 2px}   /* 해야 할 일과 같은 형광펜 */
.backlog p{font-size:var(--fs-xs);color:var(--ink-2);margin:0 0 7px;line-height:1.5}
.bl-list{background:#fff;border-radius:var(--r-sm);padding:2px 10px}
.bl{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line-soft);min-height:40px;flex-wrap:wrap}
.bl-list .bl:first-child{border-top:0}
.bl .d{flex:none;min-width:58px;font-size:13px;font-variant-numeric:tabular-nums}
.bl .w{flex:1 1 70px;min-width:0;font-size:var(--fs-xs);color:var(--ink-3)}
.blacts{display:flex;gap:6px;flex:none}
.bl .go{font-size:var(--fs-xs);padding:6px 11px;border-radius:999px;color:var(--pulse-strong);border:1.5px solid var(--pulse);background:var(--surface);white-space:nowrap}
.bl .go.pri{background:var(--pulse);color:#fff}
.bl .go.mute{color:var(--ink-3);border-color:var(--line);background:transparent}
.blmove{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:2px 0 9px}
.blmove .lb{font-size:var(--fs-xs);color:var(--ink-3)}
.blmove input{flex:1 1 140px;min-width:0;min-height:var(--tap);font-family:inherit;font-size:16px;color:var(--ink);
  background:var(--field);border:2px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;-webkit-appearance:none;appearance:none}
.blmove .btn{flex:none}
.bl-more{font-size:var(--fs-xs);color:var(--ink-3);margin-top:7px}

/* ── 설치·옮겨오기 ── */
.install{background:var(--mint-wash);border:2px solid var(--mint);border-radius:var(--r-md);padding:10px 12px 11px}
.install h2,.carryover h2{font-size:var(--fs-md);font-weight:400;color:var(--pulse-strong);margin:0 0 2px}
.install p,.carryover p{font-size:var(--fs-sm);color:var(--ink-2);line-height:1.55}
.install .steps{font-size:var(--fs-sm);color:var(--ink-2);margin-top:7px;line-height:1.8}
.key{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:var(--fs-xs)}
.acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.carryover{background:var(--amber-wash);border:2px solid #ffd35c;border-radius:var(--r-md);padding:10px 12px 11px}
.carryover h2{color:var(--amber)}

/* ── 기록 보관 ── */
.keep{background:var(--surface);border:2px dashed var(--mint-2);border-radius:var(--r-md);padding:8px 14px 10px}
.sec-head{display:flex;align-items:center;gap:9px;width:100%;text-align:left;min-height:var(--tap);padding:2px 0}
.sec-t{font-size:var(--fs-md);color:var(--sky-strong);flex:none}
.sec-sum{flex:1;min-width:0;font-size:var(--fs-xs);color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.sec-sum.warn{color:var(--coral)}
.sec-sum.good{color:var(--pulse)}
.chev{flex:none;width:20px;height:20px;color:var(--ink-3);transition:transform .18s var(--ease)}
.chev svg{width:20px;height:20px;display:block}
.sec-head.open .chev{transform:rotate(180deg)}
.sec-body{padding:2px 0 6px}
.sec+.sec{border-top:1px dashed var(--line);margin-top:4px;padding-top:2px}
.keep .status{font-size:var(--fs-sm);color:var(--ink-2);line-height:1.55}
.keep .status b{font-weight:400;color:var(--pulse-strong)}
.keep .warn{color:var(--coral)}
.keep .meta{font-size:var(--fs-xs);color:var(--ink-3);margin-top:2px;line-height:1.6}
.keep p{font-size:var(--fs-xs);color:var(--ink-3);line-height:1.6}
.keep p.hint{margin-top:5px;padding:7px 9px;background:var(--bg2);border-radius:var(--r-sm)}
.keep .sst{font-size:var(--fs-sm);color:var(--ink-2);margin-bottom:3px}
.keep input.url{width:100%;font-family:inherit;font-size:16px;min-height:var(--tap);padding:8px 12px;margin-top:7px;color:var(--ink);
  background:var(--field);border:2px solid var(--line);border-radius:var(--r-sm);-webkit-appearance:none;appearance:none}
.rulefld{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:8px}
.rulefld .lb{font-size:var(--fs-xs);color:var(--ink-3)}
.rulefld input{flex:0 0 70px;min-width:0;height:var(--pill);font-family:inherit;font-size:16px;color:var(--ink);text-align:center;
  background:var(--field);border:2px solid var(--line);border-radius:var(--r-sm);-webkit-appearance:none;appearance:none}

.gear{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--pulse-strong);background:none;border:0}   /* 해 모양 아이콘만 */
.gear svg{width:28px;height:28px;transition:transform .4s var(--ease)}
.gear.on{color:var(--pulse)}
.gear.on svg{transform:rotate(60deg)}
.settings{display:flex;flex-direction:column;gap:8px}
.set-head{display:flex;align-items:center;justify-content:space-between}
.set-t{font-size:var(--fs-xl);color:var(--pulse-strong)}
.set-x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.set-x svg{width:18px;height:18px}
footer{font-size:var(--fs-xs);color:var(--ink-3);text-align:center;line-height:1.8}
.ver{opacity:.55;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translate(-50%,14px);z-index:30;
  max-width:min(440px,calc(100vw - 32px));background:var(--ink);color:#fff;border-radius:999px;padding:11px 18px;
  font-size:var(--fs-sm);line-height:1.4;text-align:center;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;
  transition:opacity .2s var(--ease),transform .24s var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:359px){
  .wrap{padding-left:calc(12px + var(--safe-l));padding-right:calc(12px + var(--safe-r))}
  .board .cell{padding:6px 6px 7px}
  .day .n{width:21px;height:21px}
  .g-num{min-width:60px}
}
@media (min-width:720px){.wrap{max-width:600px;padding-top:32px}}
.st,.badge,.board .v,.day .n{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <button class="plane" id="plane" aria-label="아유"></button>
    <h1 class="title">날아라 <em>아유 보드</em><span class="sub">배운 만큼 한 뼘씩, 더 높이</span></h1>
    <button class="gear" id="gear" aria-label="설정" aria-expanded="false"></button>
  </header>

  <section class="flight" id="flight"></section>

  <section class="board" id="board"></section>

  <section class="card cal">
    <div class="cal-head">
      <div class="cal-title" id="calTitle"></div>
      <div class="nav">
        <button class="jump" id="today" aria-label="오늘 보기">오늘</button>
        <button id="prev" aria-label="이전 달"></button>
        <button id="next" aria-label="다음 달"></button>
      </div>
    </div>
    <div class="dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid"></div>
    <div class="cal-leg" id="calLeg"></div>
  </section>

  <section id="roleWrap"></section>

  <section class="card daypanel" id="dayPanel"></section>

  <section id="backlogWrap"></section>

  <section class="card growth" id="growth"></section>

  <section id="installWrap"></section>
  <section id="carryWrap"></section>

  <section class="settings" id="settings" hidden>

  function tasksFor(d){return state.todos.filter(function(t){return t.date===d&&!t.del&&t.kind!=="note"&&(!t.ghost||t.srcId);});}

  function createTodos(c){
    var text=(c.text||"").trim();

        ? '<span>다음 단계 <b style="font-weight:400">'+N.name+'</b></span><span class="pill">'+(N.at-n)+'개만 더!</span>'

  function cloud(l,t,w){
    return '<svg class="deco" style="left:'+l+'%;top:'+t+'%;width:'+w+'px" viewBox="0 0 40 22"><path d="M10 20a8 8 0 0 1-1-15.9A10 10 0 0 1 28 5a7.5 7.5 0 0 1 2 15z" fill="#fff" opacity=".72"/></svg>';

  function renderBoard(){
    var t=tally(),st=streak();
    var beat=lastStreak!==null&&st>lastStreak?" beat":"";
    lastStreak=st;
    $("board").innerHTML=
      '<div class="cell"><span class="v'+beat+'">'+st+'<u>일</u></span><span class="k">연속 비행</span></div>'+

      '<div class="cell"><span class="v">'+t.stickers+'<u>개</u></span><span class="k">칭찬 스티커</span></div>';
  }

  var growthOpen=false;   /* 과목별 성장은 평소에 접혀 있다 */
  function renderGrowth(){
    var g=growthStats(growthRange),max=1,sumDone=0,sumMin=0;
    /* 지금 쓰는 과목은 모두 보이고, 숨긴 과목은 그 기간에 기록이 있을 때만 보인다 */
    var list=state.subjects.filter(function(x){return !x.del||(g[x.id]&&g[x.id].total);});
    Object.keys(g).forEach(function(id){if(g[id].total&&!list.some(function(x){return x.id===id;})) list.push(subjOf(id));});
    list.forEach(function(s){var o=g[s.id];max=Math.max(max,o.done);sumDone+=o.done;sumMin+=o.min;});
    var rows=list.map(function(s){
      var o=g[s.id];
      return '<div class="g-row">'+subjTag(s)+
        '<span class="g-bar"><i style="background:'+s.color+';width:'+(o.done?Math.max(6,Math.round(o.done/max*100)):0)+'%"></i></span>'+
        '<span class="g-num">'+o.done+'개'+(o.min?' <small>· '+fmtMin(o.min)+'</small>':(o.total>o.done?' <small>/ '+o.total+'</small>':''))+'</span></div>';
    }).join("");
    var names={week:"이번 주",month:"이번 달",all:"전체"};
    $("growth").innerHTML='<div class="bl-in">'+
      '<button class="g-toggle'+(growthOpen?" open":"")+'" id="gToggle" aria-expanded="'+growthOpen+'">'+
        '<span class="g-title">과목별 성장</span>'+
        '<span class="g-sum">'+names[growthRange]+' '+sumDone+'개</span>'+
        '<span class="chev">'+icon("chev")+'</span></button>'+
      (growthOpen
        ? '<div class="g-body"><div class="seg">'+
            ["week","month","all"].map(function(k){return '<button data-grange="'+k+'" class="'+(growthRange===k?"on":"")+'">'+names[k]+'</button>';}).join("")+
          '</div><div class="bl-list g-list">'+rows+'</div>'+
          '<div class="g-foot">'+names[growthRange]+' 해낸 학습 '+sumDone+'개'+(sumMin?' · 공부한 시간 '+fmtMin(sumMin):'')+'</div></div>'
        : '')+'</div>';
  }
  function fmtMin(m){var h=Math.floor(m/60),r=m%60;return h?(h+"시간"+(r?" "+r+"분":"")):(r+"분");}

  /* ---------- 작성 폼 ---------- */
  var composer=null;
  function openComposer(d){
    var ls=subjOf(state.lastSubj);
    composer={date:d,text:"",subj:(ls.del||!ls.name)?(subjects()[0]||{}).id:ls.id,newSub:null,count:"",unit:"쪽",
      mode:"one",from:d,to:clampDate(shift(d,27)),dows:[1,2,3,4,5],err:""};
  }
  function openEditor(t){
    composer={date:t.date,editId:t.id,newSub:null,text:t.text,subj:t.subj||"etc",count:t.count?String(t.count):"",
      unit:t.unit||"쪽",mode:"one",from:t.date,to:t.date,dows:[],err:""};
  }
  function subjChips(c){
    var list=subjects();
    if(!list.some(function(x){return x.id===c.subj;})) list=list.concat([subjOf(c.subj)]);
    return '<div class="chips subjs">'+list.map(function(s){
      var on=c.subj===s.id;
      return '<button class="chip'+(on?" on":"")+'" data-subj="'+s.id+'"'+(on?' style="background:'+s.color+';border-color:'+s.color+'"':'')+'><i style="background:'+s.color+'"></i>'+esc(s.name)+'</button>';
    }).join("")+
      (c.newSub==null?'<button class="chip addsub" data-addsub>+ 과목</button>':'')+'</div>'+
      (c.newSub!=null?'<div class="newsub"><input type="text" id="newSubIn" data-c="newSub" value="'+esc(c.newSub)+'" maxlength="10" placeholder="예: 한문" '+INPUT_ATTRS+'>'+
        '<button class="btn" data-addsub-cancel>취소</button><button class="btn primary" data-addsub-save>추가</button></div>':'');
  }
  function amountRow(c){
    var kind=kindOfUnit(c.unit);
    return '<div class="row2">'+
      '<div class="fld num"><span class="lb">학습량</span>'+
        '<input type="number" data-c="count" value="'+esc(String(c.count))+'" inputmode="numeric" min="1" max="999" placeholder="없음"></div>'+
      '<div class="fld unit"><span class="lb">단위</span>'+
        '<div class="chips">'+KINDS.map(function(k){return '<button class="chip'+(kind.id===k.id?" on":"")+'" data-kind="'+k.id+'">'+k.name+'</button>';}).join("")+'</div>'+
        '<div class="chips sub">'+kind.units.map(function(u){return '<button class="chip'+(c.unit===u?" on":"")+'" data-unit="'+u+'">'+u+'</button>';}).join("")+'</div>'+
      '</div></div>';
  }
  function addArea(d){
    if(!composer||composer.editId||composer.date!==d){
      return '<button class="addbtn" data-open-compose="'+d+'">'+icon("plus")+'학습 추가</button>';
    }
    var c=composer,S=subjOf(c.subj);
    var modes='<button class="chip'+(c.mode==="one"?" on":"")+'" data-mode="one">하루만</button>'+
              '<button class="chip'+(c.mode==="range"?" on":"")+'" data-mode="range">요일마다 반복</button>';
    var period="";
    if(c.mode==="range"){
      period='<div class="fld"><span class="lb">기간</span><div class="dates">'+
          '<input type="date" data-c="from" value="'+c.from+'" min="'+START+'" max="'+END+'" aria-label="시작일">'+
          '<span class="tilde">~</span>'+
          '<input type="date" data-c="to" value="'+c.to+'" min="'+START+'" max="'+END+'" aria-label="종료일"></div></div>'+
        '<div class="fld"><span class="lb">이 요일마다</span><div class="chips dows">'+
          DOW.map(function(n,i){return '<button class="chip'+(i===0?" sun":"")+(c.dows.indexOf(i)>=0?" on":"")+'" data-dow="'+i+'">'+n+'</button>';}).join("")+
        '</div></div><div class="chint">'+previewCount(c)+'</div>';
    }
    return '<div class="composer">'+
      '<div class="fld"><span class="lb">과목</span>'+subjChips(c)+'</div>'+
      '<div class="fld"><span class="lb">무엇을 공부할까요?</span>'+
        '<input type="text" data-c="text" value="'+esc(c.text)+'" maxlength="60" placeholder="예: '+esc(S.name)+' 공부" '+INPUT_ATTRS+'>'+
        '<div class="chips sugg" style="margin-top:6px">'+(SUGG[S.id]||[]).map(function(w){return '<button class="chip" data-sugg="'+esc(w)+'">'+esc(w)+'</button>';}).join("")+'</div>'+
      '</div>'+
      amountRow(c)+
      '<div class="fld"><span class="lb">언제</span><div class="chips">'+modes+'</div></div>'+period+
      (c.err?'<div class="cerr">'+esc(c.err)+'</div>':'')+
      '<div class="cacts"><button class="btn" data-compose-cancel>취소</button>'+
      '<button class="btn primary" data-compose-save>만들기</button></div></div>';
  }
  function editArea(t,idx,total){
    var c=composer;
    return '<div class="composer edit">'+
      '<div class="fld"><span class="lb">과목</span>'+subjChips(c)+'</div>'+
      '<div class="fld"><span class="lb">학습</span><input type="text" data-c="text" value="'+esc(c.text)+'" maxlength="60" '+INPUT_ATTRS+'></div>'+
      amountRow(c)+
      (total>1?'<div class="fld"><span class="lb">순서</span><div class="chips">'+
        '<button class="chip" data-shift="-1"'+(idx===0?" disabled":"")+'>위로</button>'+
        '<button class="chip" data-shift="1"'+(idx===total-1?" disabled":"")+'>아래로</button>'+
        '<span class="ordhint">'+(idx+1)+' / '+total+'</span></div></div>':'')+
      '<div class="fld"><span class="lb">다른 날로 옮기기 (계획이 바뀌었을 때)</span><div class="dates">'+
        '<input type="date" id="mvDate" value="'+(t.date<CUR?CUR:t.date)+'" min="'+CUR+'" max="'+END+'" aria-label="옮길 날짜">'+
        '<button class="btn" data-move-one="'+t.id+'" style="flex:none">옮기기</button></div></div>'+
      (t.by?'<div class="chint">처음 작성 '+byTag(t.by)+'</div>':'')+
      (c.err?'<div class="cerr">'+esc(c.err)+'</div>':'')+
      '<div class="cacts"><button class="btn primary" data-edit-save>저장</button>'+
      '<button class="btn" data-compose-cancel>취소</button>'+
      '<button class="btn warn" data-edit-del="'+t.id+'">삭제</button></div></div>';
  }
  function previewCount(c){
    var from=c.from,to=c.to;
    if(!from||!to) return "";
    if(from>to){var sw=from;from=to;to=sw;}
    from=clampDate(from);to=clampDate(to);
    if(!c.dows.length) return "요일을 하나 이상 골라 주세요.";
    var n=0,d=from,g=0;
    while(d<=to&&g++<500){if(c.dows.indexOf(parse(d).getDay())>=0)n++;d=shift(d,1);}
    return n?("학습 "+n+"개가 만들어져요."):"그 기간에는 고른 요일이 없어요.";
  }

  function todoList(d){
    var list=todosFor(d);
    if(!list.length) return '<div class="empty">아직 계획한 학습이 없어요. 아래에서 추가해 보세요.</div>';
    return list.map(function(t,idx){
      if(composer&&composer.editId===t.id) return editArea(t,idx,list.length);
      var S=subjOf(t.subj),badge="";
      if(t.ghost){
        /* 지난 날에 남은 자국 — 회색, 체크할 수 없고, 배지를 누르면 옮긴 날로 간다 */
        var gd=isDone(t);
        return '<div class="todo ghost'+(gd?" gdone":"")+'">'+
          '<button class="box" data-ghost="'+t.movedTo+'" style="color:'+S.color+';background:'+wash(S.color)+'" aria-label="'+mmdd(t.movedTo)+'에서 체크할 수 있어요">'+toolIcon(S.icon)+(gd?redCircle(false):"")+'</button>'+
          '<span class="txt">'+subjMini(S)+'<span class="tt">'+esc(t.text)+'</span>'+
            '<button class="carry mv" data-open="'+t.movedTo+'">이동 → '+mmdd(t.movedTo)+'</button></span>'+
          (t.count?'<span class="t-count">'+t.count+'<u>'+esc(t.unit||"")+'</u></span>':'')+
          '<button class="del" data-del="'+t.id+'" aria-label="자국 지우기">'+icon("close")+'</button></div>';
      }
      if(t.movedFrom&&t.movedFrom!==t.date) badge+='<span class="carry mv">이동 ← '+mmdd(t.movedFrom)+'</span>';
      if(t.origDate&&!t.done){
        var late=Math.round((parse(t.date)-parse(t.origDate))/86400000);
        if(late>0) badge='<span class="carry'+(late>=7?" long":"")+'">'+late+'일 넘어옴</span>';
      }
      if(t.skip&&!t.done) badge+='<span class="carry skip">건너뜀</span>';
      return '<div class="todo'+(t.done?" on":"")+'">'+
        '<button class="box" style="color:'+S.color+';background:'+wash(S.color)+'" data-todo="'+t.id+'" aria-label="'+(t.done?"완료 취소":"완료 표시")+'">'+toolIcon(S.icon)+(t.done?redCircle(pop==="t:"+t.id||pop==="day:"+t.date):"")+'</button>'+
        '<button class="txt" data-edit="'+t.id+'">'+subjMini(S)+'<span class="tt">'+esc(t.text)+'</span>'+byTag(t.by)+badge+'</button>'+
        (t.count?'<button class="t-count" data-edit="'+t.id+'">'+t.count+'<u>'+esc(t.unit||"")+'</u></button>':'')+
        '<button class="addkid" data-addkid="'+t.id+'" aria-label="추가 학습·코멘트 달기">'+icon("plus")+'</button>'+
        '<button class="del" data-del="'+t.id+'" aria-label="삭제">'+icon("close")+'</button></div>'+
        kidsHtml(t);
    }).join("");
  }

  /* 학습 목록 보기 — 하루(기본: 오늘) · 이번 주 · 이번 달 · 기간 */
  var listMode="day", listFrom=null, listTo=null;
  function weekStart(d){var p=parse(d);return shift(d,-((p.getDay()+6)%7));}
  function modeRange(){
    if(listMode==="week"){var a=weekStart(CUR);return [a,shift(a,6)];}
    if(listMode==="month"){var p=parse(CUR);return [CUR.slice(0,8)+"01",fmt(new Date(p.getFullYear(),p.getMonth()+1,0))];}
    if(listMode==="range"){
      var f=listFrom||weekStart(CUR),t=listTo||shift(f,6); if(f>t){var x=f;f=t;t=x;} return [f,t];
    }
    return [SEL,SEL];
  }
  function modeTabs(){
    var tabs=[["day","오늘"],["week","이번 주"],["month","이번 달"],["range","기간"]];
    return '<div class="seg lmode">'+tabs.map(function(t){
      var on=t[0]===listMode&&(t[0]!=="day"||SEL===CUR);
      return '<button data-lmode="'+t[0]+'" class="'+(on?"on":"")+'">'+t[1]+'</button>';
    }).join("")+'</div>';
  }
  function renderList(){
    var r=modeRange(),from=r[0],to=r[1],total=0,done=0,html="",d=from,g=0;
    var names={week:"이번 주의 학습",month:"이번 달의 학습",range:"기간 학습"};
    var head='<div class="today-head"><div><div class="eyebrow">'+names[listMode]+'</div>'+
      '<div class="today-date">'+label(from)+' ~ '+label(to)+'</div></div></div>'+modeTabs();
    if(listMode==="range"){
      head+='<div class="lrange"><input type="date" id="lrFrom" data-lr="from" value="'+from+'" min="'+START+'" max="'+END+'" aria-label="시작일">'+
        '<span>~</span><input type="date" id="lrTo" data-lr="to" value="'+to+'" min="'+START+'" max="'+END+'" aria-label="종료일"></div>';
    }
    while(d<=to&&g++<400){
      var list=todosFor(d);
      if(list.length){
        list.forEach(function(t){total++;if(t.done)done++;});
        var st=dayStat(d);
        html+='<div class="lday"><button class="lday-h" data-open="'+d+'"><span>'+label(d)+' '+dowOf(d)+'요일'+(d===CUR?' <em>오늘</em>':'')+'</span>'+
          '<span class="lday-n">'+(st.complete?'다 했어요':st.done+' / '+st.total)+'</span></button>'+todoList(d)+'</div>';
      }
      d=shift(d,1);
    }
    if(total) head+='<div class="dprog"><span class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></span><span>'+done+' / '+total+'</span></div>';
    $("dayPanel").innerHTML=head+'<div class="todos">'+(html||'<div class="empty">이 기간에는 계획한 학습이 없어요.</div>')+'</div>';
  }
  /* 하위 항목 — ㄴ 추가 학습(체크하면 빨간 동그라미) · ㄴ 코멘트(말풍선) */
  var kidForm=null;   /* {pid, kind, text, err} */
  var kidEdit=null;   /* 하위 항목 고치기 {id, text, err} */
  function kidEditArea(k){
    var task=k.kind!=="note";
    return '<div class="kidform">'+
      '<div class="newsub"><input type="text" id="kidEd" data-ke="text" value="'+esc(kidEdit.text)+'" maxlength="80" '+INPUT_ATTRS+'></div>'+
      (task?'<div class="dates"><span class="kf-me" style="flex:none">다른 날로 옮기기</span>'+

      '<button class="btn primary" data-kedit-save>저장</button><button class="btn" data-kedit-cancel>취소</button>'+
      '<button class="btn warn" data-kdel="'+k.id+'">삭제</button></div></div>';
  }
  function kidsHtml(t){
    var html=kidsOf(t.id).map(function(k){
      if(kidEdit&&kidEdit.id===k.id) return kidEditArea(k);
      if(k.ghost){
        var kgd=isDone(k);
        return '<div class="kid ghost'+(kgd?" gdone":"")+'"><span class="kid-l">ㄴ</span><button class="kbox" data-ghost="'+k.movedTo+'" aria-label="'+mmdd(k.movedTo)+'에서 체크할 수 있어요">'+(kgd?'<svg class="vchk" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 8.4l3 3.1 6.6-7.2"/></svg>':'')+'</button>'+
          '<span class="kt">'+esc(k.text)+'</span>'+
          '<button class="carry mv" data-open="'+k.movedTo+'">이동 → '+mmdd(k.movedTo)+'</button>'+
          '<button class="del" data-del="'+k.id+'" aria-label="자국 지우기">'+icon("close")+'</button></div>';
      }
      if(k.kind==="note"){
        return '<div class="kid note"><span class="kid-l">ㄴ</span><span class="kic">'+icon("chat")+'</span>'+
          '<button class="kt" data-kedit="'+k.id+'">'+esc(k.text)+byTag(k.by)+'</button>'+
          '<button class="del" data-del="'+k.id+'" aria-label="코멘트 삭제">'+icon("close")+'</button></div>';
      }
      return '<div class="kid'+(k.done?" on":"")+'"><span class="kid-l">ㄴ</span>'+
        '<button class="kbox" data-todo="'+k.id+'" aria-label="'+(k.done?"완료 취소":"완료 표시")+'">'+(k.done?'<svg class="vchk'+(pop==="t:"+k.id?" pop":"")+'" viewBox="0 0 16 16" aria-hidden="true"><path pathLength="100" d="M3.2 8.4l3 3.1 6.6-7.2"/></svg>':"")+'</button>'+
        '<button class="kt" data-kedit="'+k.id+'"><span class="hl">'+esc(k.text)+'</span>'+byTag(k.by)+'</button>'+
        '<button class="del" data-del="'+k.id+'" aria-label="추가 학습 삭제">'+icon("close")+'</button></div>';
    }).join("");
    if(kidForm&&kidForm.pid===t.id){
      var me=roleOf(getMe());
      html+='<div class="kidform">'+
        '<div class="chips"><button class="chip'+(kidForm.kind==="task"?" on":"")+'" data-kkind="task">ㄴ 추가 학습</button>'+
        '<button class="chip'+(kidForm.kind==="note"?" on":"")+'" data-kkind="note">ㄴ 코멘트</button></div>'+
        '<div class="newsub"><input type="text" id="kidIn" data-k="text" value="'+esc(kidForm.text)+'" maxlength="80" placeholder="'+
          (kidForm.kind==="note"?"예: 끝까지 집중해서 풀었어!":"예: 오답노트 쓰기")+'" '+INPUT_ATTRS+'></div>'+

  function exportData(){
    var payload={app:"ayu-board",v:DATA_V,exportedAt:new Date().toISOString(),from:"날아라 아유 보드",
      data:{todos:state.todos,notes:state.notes,subjects:state.subjects,rule:state.rule,ruleAt:state.ruleAt,lastSubj:state.lastSubj}};
    var text=JSON.stringify(payload,null,2),name="아유보드-백업-"+fmt(new Date())+".json";
    state.backupAt=new Date().toISOString(); save();
    try{

        if(navigator.canShare({files:[file]})){
          navigator.share({files:[file],title:name}).then(function(){toast("백업 파일을 저장했어요.");}).catch(function(){});
          return;

    }catch(e){}
    var url=URL.createObjectURL(new Blob([text],{type:"application/json"}));
    var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},2000);

  /* 불러오기는 합치기 — 지금 기록을 지우지 않는다 */
  function importData(text){
    var raw; try{raw=JSON.parse(text);}catch(e){raw=null;}
    var inc=normalize(raw);
    if(!inc){toast("아유 보드 백업 파일이 아닌 것 같아요.");return;}
    var r=mergeInto(inc);
    save(); rollover(); lastStreak=null; lastLevel=null; renderAll(); lastStreak=streak();
    toast(r?("기록을 합쳤어요 — 새로 들어온 것 "+r+"개"):"새로 들어올 기록이 없었어요.");
  }
  function mergeInto(rem){
    var n=0,byId={};
    state.todos.forEach(function(t){byId[t.id]=t;});
    (rem.todos||[]).forEach(function(t){
      if(!t||!t.id||!t.date) return;
      var mine=byId[t.id];
      if(!mine){state.todos.push(t);n++;}
      else if(mine.del&&!t.del){}   /* 지운 기록은 무조건 지운 채로 — 다른 폰의 옛 사본이 되살리지 못하게 */
      else if((t.del&&!mine.del)||(t.u||0)>(mine.u||0)){for(var k0 in mine) if(!(k0 in t)) delete mine[k0]; for(var k in t) mine[k]=t[k]; n++;}   /* 통째로 바꾼다 — 한쪽에서 지운 칸이 되살아나지 않게 */
    });
    Object.keys(rem.notes||{}).forEach(function(d){
      var a=state.notes[d],b=rem.notes[d];
      if(b&&(!a||(b.u||0)>(a.u||0))){state.notes[d]=b;n++;}
    });
    (rem.subjects||[]).forEach(function(x){
      if(!x||!x.id) return;
      var mine=null; state.subjects.forEach(function(y){if(y.id===x.id) mine=y;});
      if(!mine){state.subjects.push(x);n++;}
      else if((x.u||0)>(mine.u||0)){for(var k in x) mine[k]=x[k];n++;}
    });
    if(rem.rule&&(rem.ruleAt||0)>(state.ruleAt||0)){state.rule=rem.rule;state.ruleAt=rem.ruleAt;n++;}
    return n;
  }

  /* ---------- 함께 보기 (Firebase Realtime Database, REST) ----------

  var sync=null,syncAt=null,syncing=false,syncErr=false,pushTimer=null,pollTimer=null,syncMsg="";
  /* 기본은 '켜짐' — 홈 화면 앱은 사파리와 저장 공간이 따로라서, 설정을 물려받지 못해도

  function loadSync(){
    var o=null; try{o=JSON.parse(readKey(SYNC_KEY)||"null");}catch(e){}
    if(o&&o.off){sync=null;return;}
    sync={db:(o&&o.db)||DEFAULT_DB};

  }

  function syncUrl(){return sync.db.replace(/\/+$/,"")+"/"+SHARED+"/"+encodeURIComponent(KEY)+".json";}
  function payload(){return {todos:state.todos,notes:state.notes,subjects:state.subjects,rule:state.rule,ruleAt:state.ruleAt,at:Date.now()};}
  function remOf(rem){return {todos:rem.todos||[],notes:rem.notes||{},subjects:rem.subjects||[],rule:rem.rule,ruleAt:rem.ruleAt};}
  var quietSave=false;
  function saveQuiet(){quietSave=true;try{save();}finally{quietSave=false;}}
  /* 서버에 없는(또는 서버보다 새로운) 기록이 이 폰에 있는지 */
  function remoteBehind(rem){
    if(!rem) return true;
    var m={},rd={}; (rem.todos||[]).forEach(function(t){if(t&&t.id){m[t.id]=t.u||0; if(t.del) rd[t.id]=1;}});
    for(var i=0;i<state.todos.length;i++){var t=state.todos[i]; if(!(t.id in m)||(t.u||0)>m[t.id]||(t.del&&!rd[t.id])) return true;}
    var rn=rem.notes||{};
    for(var d in state.notes){if(!rn[d]||(state.notes[d].u||0)>(rn[d].u||0)) return true;}
    var rs={}; (rem.subjects||[]).forEach(function(x){if(x&&x.id) rs[x.id]=x.u||0;});
    for(var j=0;j<state.subjects.length;j++){var x=state.subjects[j]; if(!(x.id in rs)||(x.u||0)>rs[x.id]) return true;}
    return (state.ruleAt||0)>(rem.ruleAt||0);
  }
  function afterMerge(changed){
    if(repairMoves()) changed=true;
    if(changed){saveQuiet();rollover();lastStreak=null;renderAll();lastStreak=streak();}
    else if(booted) renderKeep();
  }
  function getRemote(){return fetch(syncUrl(),{cache:"no-store"}).then(function(r){if(!r.ok) throw 0;return r.json();});}
  function pull(){
    if(!sync) return;
    syncing=true; if(booted) renderKeep();
    getRemote().then(function(rem){
      syncErr=false;syncing=false;syncAt=Date.now();
      afterMerge(rem?mergeInto(remOf(rem)):0);
      if(remoteBehind(rem)) schedulePush();   /* 이 폰에만 있는 기록은 올린다 */
    }).catch(function(){syncErr=true;syncing=false;if(booted)renderKeep();});
  }
  /* 보내기 전에 서버 것을 먼저 받아 합친다 — 다른 폰이 방금 넣은 기록을 덮어쓰지 않게 */
  var pushing=false,pushAgain=false;
  function pushNow(){
    if(!sync) return;
    if(pushing){pushAgain=true;return;}
    pushing=true;
    getRemote().then(function(rem){
      if(rem) afterMerge(mergeInto(remOf(rem)));
      return fetch(syncUrl(),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload())});
    }).then(function(r){syncErr=!r.ok;if(r.ok)syncAt=Date.now();})
      .catch(function(){syncErr=true;})
      .then(function(){pushing=false;if(booted)renderKeep();if(pushAgain){pushAgain=false;schedulePush();}});
  }
  function schedulePush(){if(!sync||quietSave) return;clearTimeout(pushTimer);pushTimer=setTimeout(pushNow,1200);}
  function startPolling(){clearInterval(pollTimer);if(!sync) return;pollTimer=setInterval(function(){if(!document.hidden) pull();},15000);}
  function connectSync(db){
    db=(db||"").trim().replace(/\/+$/,"");
    if(!/^https:\/\/[\w.-]+\.(firebaseio\.com|firebasedatabase\.app)$/.test(db))
      return "주소가 올바르지 않아요. https:// 로 시작하는 Firebase 데이터베이스 주소를 넣어 주세요.";
    sync={db:db}; saveSync();
    pull(); startPolling();
    return null;
  }
  function disconnectSync(){sync=null;saveSync();syncAt=null;syncErr=false;clearInterval(pollTimer);clearTimeout(pushTimer);renderKeep();}
  function syncBox(){
    var sum,cls="";
    if(!sync) sum="꺼짐"; else if(syncErr){sum="연결 안 됨";cls="warn";} else if(syncing) sum="주고받는 중"; else {sum="켜짐";cls="good";}
    var body;
    if(!sync){
      body='<p>같은 데이터베이스 주소로 연결한 폰끼리 기록이 함께 보여요.</p>'+
        '<input class="url" type="text" id="syncUrlIn" value="'+esc(DEFAULT_DB)+'" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">'+
        (syncMsg?'<div class="cerr" style="margin-top:6px">'+esc(syncMsg)+'</div>':'')+
        '<div class="acts"><button class="btn primary" id="syncSave">'+icon("link")+'연결</button></div>';
    }else{
      var st=syncErr?'<span class="warn">연결이 안 돼요 — 인터넷을 확인해 주세요</span>':syncing?'주고받는 중…':(syncAt?'마지막 동기화 '+whenLabel(new Date(syncAt).toISOString()):'연결됨');
      body='<p class="sst">'+st+'</p><p>'+esc(sync.db.replace(/^https:\/\//,""))+'</p>'+
        '<div class="acts"><button class="btn" id="syncOff">연결 끊기</button></div>';
    }
    return '<div class="sec">'+secHead("sync","함께 보기",sum,cls)+'<div class="sec-body"'+(secOpen.sync?"":" hidden")+'>'+body+'</div></div>';
  }

  $("gear").innerHTML=icon("gear");
  $("setClose").innerHTML=icon("close");
  $("prev").innerHTML=icon("left");
  $("next").innerHTML=icon("right");
  if(repairMoves()) save();
  rollover();
  booted=true;
  loadSync();
  if(sync){pull();startPolling();}
  renderAll();
  lastStreak=streak();
  setTimeout(flyPlane,400);
  if(restored) toast("기록이 손상돼 있어 직전 안전본으로 되살렸어요.");
})();
</script>
</body>
</html>
